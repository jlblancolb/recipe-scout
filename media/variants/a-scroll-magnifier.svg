<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1d3550"/>
      <stop offset="1" stop-color="#0a1322"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset="0.5" stop-color="#b8862e"/>
      <stop offset="1" stop-color="#6e4c17"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9c08c"/>
      <stop offset="0.5" stop-color="#f4e6c0"/>
      <stop offset="1" stop-color="#d2b57c"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e6c0"/>
      <stop offset="0.55" stop-color="#d2b57c"/>
      <stop offset="1" stop-color="#8f6d36"/>
    </linearGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#5fd3c8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1d3550" stop-opacity="0.92"/>
    </radialGradient>
    <radialGradient id="ok" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#6ff07a"/>
      <stop offset="1" stop-color="#1e9a33"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="url(#frame)" stroke-width="16"/>

  <!-- recipe scroll -->
  <g transform="rotate(-10 200 260)">
    <rect x="96" y="112" width="200" height="290" fill="url(#paper)"/>
    <g stroke="#8f6d36" stroke-width="9" stroke-linecap="round" opacity="0.7">
      <line x1="126" y1="160" x2="262" y2="160"/>
      <line x1="126" y1="196" x2="236" y2="196"/>
      <line x1="126" y1="232" x2="256" y2="232"/>
      <line x1="126" y1="268" x2="222" y2="268"/>
      <line x1="126" y1="304" x2="250" y2="304"/>
      <line x1="126" y1="340" x2="206" y2="340"/>
    </g>
    <rect x="80" y="92" width="232" height="34" rx="17" fill="url(#roll)" stroke="#6e4c17" stroke-width="4"/>
    <rect x="80" y="388" width="232" height="34" rx="17" fill="url(#roll)" stroke="#6e4c17" stroke-width="4"/>
    <!-- wax seal ribbon -->
    <path d="M250 404 l-8 62 l20 -14 l20 14 l-8 -62 z" fill="#b8282a"/>
    <circle cx="262" cy="402" r="20" fill="#d23a30" stroke="#8e1d1d" stroke-width="4"/>
  </g>

  <!-- magnifier handle -->
  <line x1="398" y1="318" x2="462" y2="392" stroke="#0a1322" stroke-width="40" stroke-linecap="round"/>
  <line x1="398" y1="318" x2="462" y2="392" stroke="url(#frame)" stroke-width="28" stroke-linecap="round"/>
  <!-- lens -->
  <circle cx="330" cy="238" r="104" fill="url(#lens)"/>
  <!-- boot inside the lens -->
  <path d="M298 170 Q326 164 354 170 Q350 214 352 250 Q360 264 384 270 Q410 278 410 300 L410 304 L346 304 L340 316 L306 316 L300 304 L292 304 Q284 236 298 170 Z"
        fill="#f3d58a" stroke="#0a1322" stroke-width="5" stroke-linejoin="round"/>
  <path d="M296 192 Q326 186 354 192" fill="none" stroke="#b8862e" stroke-width="9"/>
  <path d="M352 252 Q340 262 344 276" fill="none" stroke="#b8862e" stroke-width="5" stroke-linecap="round"/>
  <!-- lens rim and shine -->
  <circle cx="330" cy="238" r="104" fill="none" stroke="#0a1322" stroke-width="26"/>
  <circle cx="330" cy="238" r="104" fill="none" stroke="url(#frame)" stroke-width="16"/>
  <path d="M262 196 A76 76 0 0 1 300 160" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <!-- known check -->
  <circle cx="122" cy="404" r="50" fill="url(#ok)" stroke="#0a1322" stroke-width="7"/>
  <path d="M98 404 L116 424 L150 384" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
